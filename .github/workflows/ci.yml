name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # pbrt reference suite is the slowest part of runtests by far —
          # 256 spp on lavapipe (Mesa LLVMpipe, no HW accel) blows past
          # the 60-minute job timeout. 32 spp still catches the noise /
          # MIS regressions the suite is designed to surface; per-scene
          # convergence tolerances in test/pbrt/test_pbrt_all_materials.jl
          # are set generously enough to clear at 32 spp.
          HIKARI_PBRT_SPP: "32"

  pbrt-comparison:
    name: pbrt-v4 Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install comparison dependencies
        run: julia --project=test/pbrt -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Render and compare
        run: julia --project=test/pbrt test/pbrt/run_comparison.jl
      - uses: actions/upload-artifact@v4
        with:
          name: pbrt-comparison
          path: test/pbrt/display/

  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; pkg"dev ."; Pkg.instantiate(); Pkg.precompile()'
      - name: Build (without comparison gallery)
        env:
          GKSwstype: "100"
          DATADEPS_ALWAYS_ACCEPT: true
        run: julia --project=docs/ --color=yes docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/

  deploy-docs:
    name: Deploy Docs
    needs: [pbrt-comparison, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v2
      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/
      - name: Download comparison gallery
        uses: actions/download-artifact@v4
        with:
          name: pbrt-comparison
          path: docs/build/1/pbrt-comparison/
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; pkg"dev ."; Pkg.instantiate()'
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs -e '
            using DocumenterVitepress
            DocumenterVitepress.deploydocs(;
              root = "docs",
              repo = "github.com/JuliaGraphics/Hikari.jl",
              target = "build",
              branch = "gh-pages",
              devbranch = "master",
              push_preview = true,
            )
          '
